name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/set-release-version.mjs ${{ github.run_number }}
      - run: npm run build:win -- --publish never
      # gh creates the tag and the release together; electron-builder's own
      # publishing fails because GitHub requires the tag to exist first.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          gh release create "$version" \
            dist/*-setup.exe dist/*-setup.exe.blockmap dist/latest.yml \
            --target "$GITHUB_SHA" \
            --title "Ember Mail $version" \
            --generate-notes
